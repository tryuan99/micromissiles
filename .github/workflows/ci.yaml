name: CI

on: push

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - run: sudo apt update
      - run: sudo apt install -y libvtk9-dev
      - run: bazel build //...
      - run: |
          set -o pipefail
          PICO_TARGETS=$(bazel query --output=package //... | grep -E '(^|/)pico(/|$)' | sed -e 's|^|//|' -e 's|$|:all|')
          bazel build --platforms //pico/platform:pico2 --aspects @pico-sdk//tools:uf2_aspect.bzl%pico_uf2_aspect --output_groups=+pico_uf2_files $PICO_TARGETS
      - run: bazel test --test_output=errors //...
