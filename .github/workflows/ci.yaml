name: CI

on: push

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - run: sudo apt update
      - run: sudo apt install -y libvtk9-dev
      - run: bazel build //...
      - run: bazel test --test_output=errors //...
