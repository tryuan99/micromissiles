syntax = "proto3";

package reachability;

import "simulation/swarm/reachability/proto/mpc_config.proto";
import "simulation/swarm/reachability/proto/termination_config.proto";

// Engagement configuration, including time stepping, adaptive horizon, capture
// and termination criteria, and the MPC cost weights.
message EngagementConfig {
  // MPC configuration.
  MpcConfig mpc_config = 1;

  // Termination configuration.
  TerminationConfig termination_config = 2;

  // Plant time step in seconds.
  float plant_time_step = 3;

  // Capture radius in meters.
  float capture_radius = 4;

  // Nominal altitude that the engagement starts at in meters.
  float engagement_altitude = 5;
}
